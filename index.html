<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Daily Dose is a personal daily-discovery dashboard: memes, trending places and things, and hidden gems, with video, posts, and maps that play on the page."
    />
    <meta name="theme-color" content="#07060f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily Dose" />
    <title>Daily Dose</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      try {
        var saved = localStorage.getItem("daily-dose-theme");
        var theme = saved === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f4f1fb" : "#07060f");
      } catch (e) {}
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #07060f;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f4f1fb;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
