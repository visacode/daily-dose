# Optional. Fills missing `image` fields from og:image / twitter:image.
# A push made with the default GITHUB_TOKEN does not start other workflows,
# so after this commits, run "Deploy to GitHub Pages" from the Actions tab
# (or push any commit) to publish the new images.

name: Enrich link previews

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date YYYY-MM-DD. Leave empty to enrich the latest day."
        required: false
        type: string

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch preview images
        run: node scripts/enrich-previews.mjs "${{ inputs.date }}"

      - name: Validate
        run: node scripts/validate-data.mjs

      - name: Commit enriched JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "No preview changes"
            exit 0
          fi
          git commit -m "data: add link preview images"
          git push
